[workspace]
channels = ["conda-forge"]
platforms = [
  { platform = "linux-64", cuda = "13" },
]
preview = ["pixi-build"]

[dependencies]
osm2pgsql = ">=2.3.0,<3"
curl = ">=8.21.0,<9"
osmium-tool = ">=1.19.1,<2"
postgresql = ">=18.6,<19"  # psql client; the server runs in the compose container
langchain-openai = ">=1.6.0,<2"
pandas = ">=3.0.5,<4"
geopy = ">=2.5.0,<3"
num2words = ">=0.5.14,<0.6"
pyproj = ">=3.7.2,<4"
shapely = ">=2.1.2,<3"
nltk = ">=3.10.3,<4"
ipykernel = ">=7.3.0,<8"
psycopg = ">=3.3.4,<4"
psycopg2 = ">=2.9.12,<3"
tqdm = ">=4.70.0,<5"

[feature.dev.dependencies]
ipywidgets = ">=8.1.9,<9"
nb-cli = ">=0.0.9,<0.0.10"
ruff = ">=0.16.4,<0.17"
sqlfluff = ">=4.3.0,<5"

[feature.dev.pypi-dependencies]
google-colab-cli = ">=0.6.0, <0.7"
# v1 renamed KernelClient to JupyterKernelClient, breaking google-colab-cli
jupyter-kernel-client = ">=0.9.0, <1.0.0"
colab-mcp = { git = "https://github.com/googlecolab/colab-mcp", tag = "v1.0.2" }

[environments]
default = ["dev"]
