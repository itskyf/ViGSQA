version = 1

[*]
; 4 concurrent inference slots.
parallel = 4

; Keep an 8K context budget for each parallel request.
; With parallel=4, llama.cpp sizes the shared KV pool to:
; 4 * 8192 = 32768 tokens.
kv-unified = true
kv-unified-per-slot = 8192

[ornith-ai/Ornith-1.5-9B-GGUF:Q4_K_M]
hf-repo = ornith-ai/Ornith-1.5-9B-GGUF:Q4_K_M
; Text-only QA; do not load the vision projector.
no-mmproj = true

[unsloth/Qwen3.5-9B-GGUF:UD-Q4_K_XL]
hf-repo = unsloth/Qwen3.5-9B-GGUF:UD-Q4_K_XL
; Text-only QA; do not load the vision projector.
no-mmproj = true
