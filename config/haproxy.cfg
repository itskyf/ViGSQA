defaults
    mode http
    timeout connect 5s
    timeout client  1h
    timeout server  1h
    timeout queue   1h

resolvers podman_dns
    # aardvark-dns (podman's embedded DNS at the network gateway). Without a
    # resolvers section HAProxy resolves server names once at boot, so a
    # recreated llamacpp container leaves it knocking on a stale IP and every
    # request gets a 503 even though the new container is healthy.
    nameserver aardvark 10.89.0.1:53
    hold valid 10s
    hold obsolete 60s

frontend llm
    bind :8080
    monitor-uri /health
    default_backend llamacpp_pool

backend llamacpp_pool
    balance first
    option httpchk GET /health

    server remote_8000 host.containers.internal:8000 maxconn 16 check
    server local       llamacpp:8080 maxconn 4 check resolvers podman_dns resolve-prefer ipv4 init-addr libc,none
